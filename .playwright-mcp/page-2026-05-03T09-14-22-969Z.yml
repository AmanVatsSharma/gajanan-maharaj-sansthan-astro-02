          - list [ref=e92]:
            - listitem [ref=e93]: Keep a flexible darshan window to handle day-wise crowd variation.
            - listitem [ref=e94]: Carry valid ID documents for all family members.
            - listitem [ref=e95]: Keep one active phone number for booking follow-up.
            - listitem [ref=e96]: Plan local movement in advance for senior citizens and children.
            - listitem [ref=e97]: Use official Sansthan communication channels for confirmations.
          - heading "Location-specific tips for devotees" [level=2] [ref=e98]:
            - link "Location-specific tips for devotees" [ref=e99] [cursor=pointer]:
              - /url: "#location-specific-tips-for-devotees"
          - paragraph [ref=e100]: Families visiting Shegaon often benefit from arriving early to avoid peak queues, especially on weekends and festival days. The temple complex and accommodation areas are well-maintained, with clear signage and helpful staff. Keep a copy of your booking confirmation handy, and carry light snacks and water for children. Senior devotees may prefer morning or late-afternoon darshan when crowds are typically lighter.
          - heading "Frequently asked questions" [level=2] [ref=e101]:
            - link "Frequently asked questions" [ref=e102] [cursor=pointer]:
              - /url: "#frequently-asked-questions"
          - paragraph [ref=e103]:
            - strong [ref=e104]: When is the best time to visit Shegaon?
            - text: Weekdays generally see fewer crowds than weekends. Early morning darshan offers a peaceful experience. Festival periods require advance booking and extra time for queues.
          - paragraph [ref=e105]:
            - strong [ref=e106]: What documents do I need for accommodation?
            - text: Valid government-issued ID for all adults, and proof of family relationship if traveling with dependents. The office may request additional details during peak season.
          - paragraph [ref=e107]:
            - strong [ref=e108]: How do I confirm my booking?
            - text: After submitting your request via WhatsApp or phone, the office will confirm availability. Keep your phone accessible for follow-up calls or messages.
